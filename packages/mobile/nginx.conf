server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # $uri.html: static export emits app.html for the /app route.
    try_files $uri $uri.html $uri/ /index.html;
  }

  # The HTML shell must always be revalidated, or an installed PWA keeps
  # serving a stale app bundle after server redeploys. Hashed assets are
  # immutable and cacheable.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  location = /app.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /health {
    proxy_pass http://relay:8787;
  }

  location /v1/ {
    proxy_pass http://relay:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
